name: macOS build and release

on:
  push:
    branches: [main]
    tags: ['triki-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test
        run: ./test.sh
      - name: Check Xcode project
        run: xcodebuild -project TrikiMediaButton.xcodeproj -scheme TrikiMediaButton -configuration Release -derivedDataPath build/Xcode CODE_SIGNING_ALLOWED=NO build
      - name: Package universal DMG
        run: ./package-dmg.sh
      - name: Checksum and release notes
        run: |
          cd build
          shasum -a 256 Triki-Remote-*.dmg > SHA256SUMS.txt
          cp ../RELEASE_NOTES.md .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Triki-Remote-DMG
          path: |
            build/Triki-Remote-*.dmg
            build/SHA256SUMS.txt
            build/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  prerelease:
    if: startsWith(github.ref, 'refs/tags/triki-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified build
        run: gh run download "$RUN_ID" --name Triki-Remote-DMG --dir release
      - name: Publish prerelease
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" Triki-Remote-*.dmg SHA256SUMS.txt \
            --verify-tag --prerelease --title "Triki Remote $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
